<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本机记忆搜索</title>
<style>body{font:17px system-ui;max-width:1100px;margin:35px auto;padding:0 18px;background:#f6f5f0;color:#25251f}form{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:180px;padding:12px}button,select{padding:12px;cursor:pointer}section.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:20px}article{background:white;padding:12px;border-radius:10px}img,video{width:100%;height:270px;object-fit:contain}p{overflow-wrap:anywhere}details{margin:20px 0;background:#e8e7df;padding:14px}summary{cursor:pointer}.note{color:#5b5b52}#original[hidden]{display:none}</style>
<h1>本机照片与视频</h1><p class="note">结果数量可设为1–50；实际不足时不补数。照片会自动在本机核验并分组，模型确认仍可能出错；其余候选保留可展开。视频沿用原始搜索。</p>
<form id="form"><input id="query" aria-label="中文查询" placeholder="用中文描述画面"><select id="mode" aria-label="媒体类型"><option value="image">照片</option><option value="video">视频内部画面</option><option value="mixed">照片＋视频</option></select><label>结果数量（1–50）<input id="limit" type="number" min="1" max="50" step="1" value="10" style="width:70px;min-width:0"></label><button id="search">查找</button></form>
<p id="status" role="status">准备中</p><button id="original" hidden>查看原始排序</button><h2 id="heading">原始候选</h2><section id="results" class="grid"></section>
<details id="other" hidden><summary id="other-summary"></summary><p class="note">这些原始候选没有获得明确支持，仍可能包含正确答案。</p><section id="remaining" class="grid"></section></details><p id="timing" class="note"></p>
<script>
const $=s=>document.querySelector(s),pause=ms=>new Promise(r=>setTimeout(r,ms));let serial=0,current=null,originalView=false;
try{const n=Number(localStorage.getItem('memorysearch.resultLimit'));if(Number.isInteger(n)&&n>=1&&n<=50)$('#limit').value=n;}catch{}
$('#limit').onchange=()=>{const n=Number($('#limit').value);if(Number.isInteger(n)&&n>=1&&n<=50){try{localStorage.setItem('memorysearch.resultLimit',String(n));}catch{}}};
const status=$('#status'),results=$('#results'),remaining=$('#remaining'),other=$('#other'),original=$('#original');
function card(row){let asset=row.asset,c=document.createElement('article'),m=document.createElement(asset.media_type==='video'?'video':'img');if(asset.media_type==='video'){m.controls=true;m.preload='metadata';m.src=asset.file_url+(row.start_s!=null?'#t='+row.start_s:'');}else{m.src=asset.thumbnail_url;m.alt='搜索照片';}let p=document.createElement('p');p.textContent='原始第 '+row.rank+' 位 · '+asset.rel_path;let link=document.createElement('a');link.href=asset.file_url;link.textContent='打开完整原件';link.target='_blank';link.rel='noopener';c.dataset.id=asset.id;c.append(m,p,link);if(asset.media_type==='video'&&row.start_s!=null){let hint=document.createElement('p');hint.textContent='检索参考时点 '+row.start_s.toFixed(2)+' 秒（未经内容核验）';c.append(hint);}return c;}
function render(p){current=p;results.replaceChildren();remaining.replaceChildren();let grouped=!!p.photo_review&&!p.photo_review.reason&&!originalView;let first=grouped?p.confirmed:p.original_results;for(let row of first)results.append(card(row));other.hidden=!grouped||!p.remaining.length;for(let row of grouped?p.remaining:[])remaining.append(card(row));$('#other-summary').textContent='其余原始候选 '+p.remaining.length+' 项（展开）';$('#heading').textContent=grouped?'模型确认（可能出错）':'原始候选';original.hidden=!p.photo_review;original.textContent=originalView?'回到核验分组':'查看原始排序';if(p.photo_review?.reason)status.textContent='照片核验'+(p.photo_review.reason==='timeout'?'超时':'不可用')+'，已显示全部原始候选和原排序。';else if(grouped)status.textContent='模型确认 '+p.confirmed.length+' 项，另有 '+p.remaining.length+' 项保留。'+(p.photo_review.complete?'核验结束。':'仍在核验，尚未结束。');}
original.onclick=()=>{originalView=!originalView;if(current)render(current);};
$('#form').onsubmit=async event=>{event.preventDefault();let mine=++serial,t=performance.now(),first=null,confirmed=null,chosenMode=$('#mode').value,chosenLimit=Number($('#limit').value);originalView=false;other.open=false;status.textContent='正在查找';try{let response=await fetch('/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('#query').value,mode:chosenMode,limit:chosenLimit})});if(!response.ok)throw Error('search');let out=await response.json();if(mine!==serial)return;let native={results:out.results,original_results:out.results,confirmed:[],remaining:[]};render(native);await new Promise(requestAnimationFrame);if(out.results.length)first=performance.now()-t;let final=native;if(out.photo_review_job){status.textContent='已显示原始候选，正在本机核验；模型首次准备会稍慢。';for(;;){if(mine!==serial)return;let r=await fetch('/photo-review/'+out.photo_review_job);if(!r.ok)throw Error('review');let p=await r.json();if(mine!==serial)return;if(p.photo_review.complete||p.confirmed.length){render(p);}else{status.textContent='原始候选已显示，正在本机核验。';}await new Promise(requestAnimationFrame);if(confirmed===null&&p.confirmed.length)confirmed=performance.now()-t;final=p;if(p.photo_review.complete)break;await pause(80);}}else status.textContent='返回 '+out.results.length+' 个原始候选。';let total=performance.now()-t;$('#timing').textContent='首屏 '+(first===null?'无卡片':(first/1000).toFixed(2)+' 秒')+' · 整页 '+(total/1000).toFixed(2)+' 秒';await fetch('/photo-ui-receipt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:chosenMode,first_cards_ms:first,first_confirmed_ms:confirmed,terminal_ms:total,returned:out.results.length,confirmed:final.confirmed.length,remaining:final.remaining.length,fallback:!!final.photo_review?.reason})});}catch{if(current){originalView=true;render(current);}status.textContent='核验或查询暂不可用，已保留可取得的原始候选；可以稍后重试。';}};
fetch('/local-status').then(r=>r.json()).then(h=>status.textContent='已建索引 '+h.indexed+' / '+h.total+' · '+h.phase).catch(()=>status.textContent='正在准备本机搜索');
</script></html>
